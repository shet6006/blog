name: Deploy static frontend

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: blog-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build static site
        env:
          NEXT_PUBLIC_API_URL: ""
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload static site
        run: |
          aws s3 sync out/ "s3://$FRONTEND_BUCKET/" \
            --delete \
            --cache-control "no-cache"
          if [[ -d out/_next/static ]]; then
            aws s3 cp out/_next/static "s3://$FRONTEND_BUCKET/_next/static" \
              --recursive \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
